name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -r | head -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK file
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/fatoura-saria-v2.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fatoura-saria-v2.2
          path: release-apk/fatoura-saria-v2.2.apk
          if-no-files-found: error

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.2
          name: "فاتورة سريعة v2.2"
          body: "تطبيق فاتورة سريعة v2.2 — حاسبة في وضع سريع بشاشة ثابتة ولوحة أرقام ظاهرة دائماً، خط طباعة حراري أوضح (فواصل منقّطة وأشرطة بيان وشريط إجمالي معكوس)، تصميم فاتورة عصري جديد على الشاشة وفي PDF، وزر تعديل الفاتورة انتقل إلى أسفل شاشة الفاتورة بعد الانتهاء."
          files: release-apk/fatoura-saria-v2.2.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
