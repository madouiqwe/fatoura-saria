name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -r | head -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK file
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/fatoura-saria-v2.7.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fatoura-saria-v2.7
          path: release-apk/fatoura-saria-v2.7.apk
          if-no-files-found: error

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.7
          name: "فاتورة سريعة v2.7"
          body: "تطبيق فاتورة سريعة v2.7 — خط عربي عصري (IBM Plex Sans Arabic) في كل الشاشات وفي الإيصال المطبوع، معاينة الإيصال قبل الطباعة بنفس الرسم النهائي، اتصال بلوتوث دائم مع إعادة اتصال تلقائية، سعر شراء الحبة وتقرير أرباح جديد (المبيعات مقابل التكلفة وصافي الربح وهامشه)."
          files: release-apk/fatoura-saria-v2.7.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
